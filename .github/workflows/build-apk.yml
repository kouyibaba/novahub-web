name: Build & Publish NovaHub Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || {
            echo "::error::Release signing secrets are required"; exit 1;
          }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/novahub-release.p12"
          chmod 600 "${{ runner.temp }}/novahub-release.p12"
          echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/novahub-release.p12" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Verify Release Signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android-app/app/build/outputs/apk/release/app-release.apk

      - name: Prepare Pages Distribution & Version Manifest
        id: meta
        run: |
          python3 - << 'EOF'
          import hashlib, json, os, re, shutil

          apk_src = "android-app/app/build/outputs/apk/release/app-release.apk"
          assert os.path.exists(apk_src), f"Missing APK: {apk_src}"

          with open("android-app/app/build.gradle", "r", encoding="utf-8") as f:
              g = f.read()
          vcode = int(re.search(r"versionCode\s+(\d+)", g).group(1))
          vname = re.search(r'versionName\s+"([^"]+)"', g).group(1)

          notes = "性能优化与功能体验升级"
          if os.path.exists("android-app/RELEASE_NOTES.txt"):
              with open("android-app/RELEASE_NOTES.txt", "r", encoding="utf-8") as nf:
                  notes = nf.read().strip() or notes

          os.makedirs("docs/apk", exist_ok=True)
          apk_dst = "docs/apk/novahub-latest.apk"
          shutil.copy2(apk_src, apk_dst)

          with open(apk_dst, "rb") as af:
              data = af.read()
          sha = hashlib.sha256(data).hexdigest()

          manifest = {
              "versionCode": vcode,
              "versionName": vname,
              "force": False,
              "notes": notes,
              "sha256": sha,
              "size": len(data),
              "url": "https://kouyibaba.github.io/novahub-web/apk/novahub-latest.apk",
              "fallback_url": f"https://github.com/kouyibaba/novahub-web/releases/download/v{vname}/NovaHub-v{vname}.apk",
          }
          with open("docs/apk-version.json", "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, ensure_ascii=False, indent=2)
              mf.write("\n")

          shutil.copy2(apk_dst, f"NovaHub-v{vname}.apk")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"vname={vname}\n")
              out.write(f"vcode={vcode}\n")
              out.write(f"sha256={sha}\n")
          print("Manifest generated:", json.dumps(manifest, ensure_ascii=False))
          EOF

      - name: Commit APK & Version Manifest to GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apk/novahub-latest.apk docs/apk-version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): release v${{ steps.meta.outputs.vname }} (${{ steps.meta.outputs.vcode }}) [skip ci]"
            published=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 3
            done
            test "$published" = true || { echo "::error::Pages publication failed"; exit 1; }
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.vname }}
          name: NovaHub v${{ steps.meta.outputs.vname }}
          files: NovaHub-v${{ steps.meta.outputs.vname }}.apk
          body_path: android-app/RELEASE_NOTES.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaHub-Android-APK
          path: NovaHub-v${{ steps.meta.outputs.vname }}.apk
