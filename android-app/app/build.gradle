plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novahub.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.novahub.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
