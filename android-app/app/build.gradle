plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novahub.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.novahub.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.4.3"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Never silently generate an unsigned release for distribution.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            def cfg = android.signingConfigs.release
            if (cfg.storeFile == null || !cfg.storeFile.exists() ||
                !cfg.storePassword || !cfg.keyAlias || !cfg.keyPassword) {
                throw new GradleException('Release signing credentials are required')
            }
        }
    }
}
