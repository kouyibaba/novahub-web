<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0C0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<title>NovaHub · 星隅</title>
<script>
(function(){
  const origFetch = window.fetch.bind(window);
  window.__NH_API_BASE__ = '';
  window.__NH_REFRESH_ENDPOINT__ = async function() {
    if (!location.hostname.endsWith('github.io')) return '';
    try {
      const r = await origFetch('./endpoint.json?t=' + Date.now(), { cache: 'no-store' });
      const d = await r.json();
      window.__NH_API_BASE__ = ((d && d.url) || '').replace(/\/+$/, '');
      return window.__NH_API_BASE__;
    } catch {
      return window.__NH_API_BASE__;
    }
  };
  if (!location.hostname.endsWith('github.io')) return;
  let ready = window.__NH_REFRESH_ENDPOINT__();
  window.fetch = async function(input, init) {
    await ready;
    const isRel = typeof input === 'string' && /^\/(api|kw|proxy)(\/|\?|$)/.test(input);
    const buildUrl = (base) => isRel && base ? base + input : input;
    const target = buildUrl(window.__NH_API_BASE__);
    try {
      const resp = await origFetch(target, init);
      if (isRel && (resp.status === 502 || resp.status === 503 || resp.status === 530)) {
        const oldBase = window.__NH_API_BASE__;
        const newBase = await window.__NH_REFRESH_ENDPOINT__();
        if (newBase && newBase !== oldBase) {
          return origFetch(buildUrl(newBase), init);
        }
      }
      return resp;
    } catch (err) {
      if (isRel) {
        const oldBase = window.__NH_API_BASE__;
        const newBase = await window.__NH_REFRESH_ENDPOINT__();
        if (newBase && newBase !== oldBase) {
          return origFetch(buildUrl(newBase), init);
        }
      }
      throw err;
    }
  };
  // 开屏防卡死兜底：4.5 秒后自动移除遮罩；若主视图仍未渲染则显示可视重试提示（避免纯黑屏）
  setTimeout(function() {
    var s = document.getElementById('nhSplash');
    if (s) s.remove();
    var v = document.getElementById('view');
    if (v && !v.innerHTML.trim()) {
      v.innerHTML = '<div style="padding:72px 24px;text-align:center;color:#d6d2c8;font-size:14px;line-height:1.8">'
        + '<div style="font-size:16px;font-weight:600;color:#f3d285;margin-bottom:8px">网络较慢，正在重连星隅…</div>'
        + '<div style="color:#8c8996;margin-bottom:18px">若长时间未加载完成，请点击下方按钮重新载入</div>'
        + '<button onclick="location.reload()" style="padding:10px 26px;border-radius:99px;border:1px solid rgba(231,198,107,.5);background:rgba(231,198,107,.16);color:#f7ead1;font-size:14px">重新加载</button>'
        + '</div>';
    }
  }, 4500);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=20261127-v249">
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<style>
#nhSplash {
  position: fixed; inset: 0; z-index: 99999; background: #090a0e;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.nh-splash-mark {
  width: 68px; height: 68px; border-radius: 20px;
  background: radial-gradient(circle at 30% 30%, rgba(231, 198, 107, 0.22), rgba(20, 21, 28, 0.92));
  border: 1px solid rgba(231, 198, 107, 0.42);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 36px rgba(212, 175, 55, 0.22);
}
.nh-splash-brand { font-size: 22px; font-weight: 700; color: #f7ead1; letter-spacing: 0.04em; }
.nh-splash-brand span { color: #e5b869; margin: 0 1px; }
.nh-splash-sub { font-size: 12px; color: #8c8996; letter-spacing: 0.14em; }
.nh-splash-bar { width: 120px; height: 2px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 6px; }
.nh-splash-bar i { display: block; width: 45%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, transparent, #e7c66b, transparent); }
</style>
</head>
<body>
<!-- 首帧开屏幕布 -->
<div id="nhSplash" class="nh-splash" aria-hidden="true">
  <div class="nh-splash-mark">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <path d="M18 3L21.6 14.4L33 18L21.6 21.6L18 33L14.4 21.6L3 18L14.4 14.4L18 3Z" fill="#E7C66B"/>
      <path d="M18 9.5L19.9 16.1L26.5 18L19.9 19.9L18 26.5L16.1 19.9L9.5 18L16.1 16.1L18 9.5Z" fill="#FFF3D1"/>
    </svg>
  </div>
  <div class="nh-splash-brand">Nova<span>.</span>Hub</div>
  <div class="nh-splash-sub">星隅 · 私人视听空间</div>
  <div class="nh-splash-bar"><i></i></div>
</div>
<!-- 顶栏 -->
<header class="topbar">
  <div class="logo" id="brandLogo"></div>
  <div class="search-box">
    <span class="search-ico" id="topSearchIco"></span>
    <input id="searchInput" class="search" type="search" placeholder="搜索影片或演员">
    <button id="searchClear" class="search-clear hidden" type="button" aria-label="清空搜索">×</button>
    <button id="searchBtn" class="search-submit" aria-label="搜索">搜索</button>
  </div>
  <button id="btnNotif" class="notif-btn hidden" type="button" aria-label="更新提醒">
    <span id="notifIco"></span>
    <span id="notifBadge" class="notif-badge hidden">0</span>
  </button>
</header>
<div id="topProgress" class="top-progress hidden" aria-hidden="true"></div>
<div id="searchHistPop" class="search-hist-pop hidden"></div>

<!-- 主内容区（SPA 视图切换） -->
<main id="view" class="view"></main>

<!-- 悬浮 Mini 音乐播放条 -->
<div id="miniBar" class="mini-bar hidden"></div>

<!-- 全局三模块悬浮切换器 -->
<div id="modeFab" class="mode-fab">
  <div id="fabMenu" class="fab-menu hidden">
    <button class="fab-item" data-mode="vod"></button>
    <button class="fab-item" data-mode="music"></button>
    <button class="fab-item" data-mode="novel"></button>
  </div>
  <button id="fabBtn" class="fab-btn" aria-label="切换模块"></button>
</div>

<!-- 底部 Dock（影视/音乐/小说模式动态切换） -->
<nav id="tabbar" class="tabbar"></nav>

<!-- 视频播放器全屏浮层 -->
<div id="playerLayer" class="player-layer hidden">
  <div class="player-head">
    <button id="playerBack" class="nav-back" type="button" aria-label="返回上一页"></button>
    <span id="playerTitle" class="player-title"></span>
    <button id="playerFav" class="btn-back"></button>
  </div>
  <div id="castBar" class="cast-bar hidden" aria-live="polite"></div>
  <div class="player-box">
    <video id="video" playsinline webkit-playsinline x-webkit-airplay="allow" x5-video-player-type="h5"></video>
    <div id="playerDimmer" class="player-dimmer" aria-hidden="true"></div>
    <div id="playerTip" class="player-tip"></div>
    <div id="playerGestureToast" class="player-gesture-toast hidden" aria-hidden="true"></div>
    <div id="playerHud" class="player-hud hidden" aria-hidden="true"></div>
    <div id="fsEpDrawer" class="fs-ep-drawer hidden" aria-hidden="true">
      <div class="fs-ep-head">
        <span>选集</span>
        <button id="fsEpClose" type="button" aria-label="关闭选集">×</button>
      </div>
      <div id="fsEpBody" class="fs-ep-body"></div>
    </div>
    <button id="btnBoxFs" class="player-box-fs" type="button" aria-label="全屏播放"></button>
  </div>
  <div class="player-ctrl">
    <div class="player-ctrl-row">
      <button id="btnPlay" aria-label="播放/暂停"></button>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="timeText">00:00 / 00:00</span>
      <span id="liveBadge" class="live-badge hidden"><i></i> LIVE 直播中</span>
    </div>
    <div class="player-ctrl-tools">
      <div class="player-ctrl-left">
        <select id="rateSel" aria-label="播放倍速">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <select id="qualitySel"><option>自动</option></select>
        <button id="btnFwd30" class="player-tool-btn" type="button" aria-label="快进30秒">+30s</button>
        <button id="btnFwd60" class="player-tool-btn" type="button" aria-label="快进1分钟">+1m</button>
        <button id="btnNextEp" class="player-tool-btn hidden" type="button" aria-label="下一集">下一集</button>
        <button id="btnFsEp" class="player-tool-btn fs-ep-btn hidden" type="button" aria-label="全屏选集">选集</button>
        <button id="btnSkipCfg" class="player-tool-btn" type="button" aria-label="片头片尾设置">片头尾</button>
        <button id="btnVodDownload" class="player-tool-btn" type="button" aria-label="下载本集">下载</button>
        <button id="btnCast" class="player-tool-btn" type="button" aria-label="投屏">投屏</button>
        <button id="btnFit" class="player-fit-btn" type="button" aria-label="切换画面铺满">铺满</button>
      </div>
      <button id="btnFs" class="player-fs-btn" type="button" aria-label="全屏"></button>
    </div>
  </div>
  <div id="epList" class="ep-list"></div>
</div>

<!-- 小说沉浸阅读器全屏浮层 -->
<div id="readerLayer" class="reader-layer hidden" data-rtheme="dark">
  <div id="readerHead" class="reader-head">
    <button id="readerBack" class="nav-back" type="button" aria-label="返回上一页"></button>
    <div class="reader-meta">
      <div id="readerBookTitle" class="reader-book-title"></div>
      <div id="readerChSub" class="reader-ch-sub"></div>
    </div>
    <button id="readerFsBtn" class="btn-back" aria-label="全屏"></button>
    <button id="readerShelfBtn" class="btn-back"></button>
  </div>

  <div id="readerScroll" class="reader-scroll">
    <article id="readerArticle" class="reader-article"></article>
    <div class="reader-inline-nav" id="readerInlineNav">
      <button id="rPrevInline" class="btn ghost">上一章</button>
      <button id="rTocInline" class="btn ghost">目录</button>
      <button id="rNextInline" class="btn primary">下一章</button>
    </div>
  </div>

  <div id="readerPageHud" class="reader-page-hud hidden"></div>

  <div id="readerFoot" class="reader-foot">
    <div class="reader-cfg-row">
      <div class="reader-font-box">
        <button id="rFontDec" class="r-pill" aria-label="减小字号">A-</button>
        <span id="rFontVal" class="r-font-val">18</span>
        <button id="rFontInc" class="r-pill" aria-label="增大字号">A+</button>
      </div>
      <div class="reader-mode-box">
        <button class="r-pill r-pmode" data-pmode="scroll">上下</button>
        <button class="r-pill r-pmode" data-pmode="page">翻页</button>
      </div>
      <div class="reader-themes">
        <button class="r-swatch dark" data-theme="dark" title="曜石暗夜">暗夜</button>
        <button class="r-swatch sepia" data-theme="sepia" title="暖羊皮纸">羊皮</button>
        <button class="r-swatch sage" data-theme="sage" title="松霜护眼">护眼</button>
      </div>
    </div>
    <div class="reader-nav-row">
      <button id="rPrevBtn" class="r-nav-btn">上一章</button>
      <button id="rTocBtn" class="r-nav-btn"></button>
      <button id="rTtsBtn" class="r-nav-btn"></button>
      <button id="rNextBtn" class="r-nav-btn primary">下一章</button>
    </div>
  </div>

  <div id="tocMask" class="toc-mask hidden">
    <div class="toc-sheet">
      <div class="toc-head">
        <span id="tocTitle" class="toc-head-title">目录</span>
        <button id="tocReverseBtn" class="btn ghost" style="padding:4px 10px;font-size:12px">倒序</button>
      </div>
      <div id="tocRangeChips" class="m-chips" style="padding:8px 14px 4px;margin:0"></div>
      <div id="tocList" class="toc-list"></div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">标题</h3>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="primary">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="history_state.js?v=20261127-v249"></script>
<script src="vod_client.js?v=20261127-v249"></script>
<script src="auth_session.js?v=20261127-v249"></script>
<script src="app.js?v=20261127-v249"></script>
</body>
</html>
