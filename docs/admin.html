<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D10">
<title>NovaHub · 站长后台</title>
<script>
(function(){
  window.__NH_API_BASE__ = '';
  if (!location.hostname.endsWith('github.io')) return;
  const origFetch = window.fetch.bind(window);
  const ready = origFetch('./endpoint.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => { window.__NH_API_BASE__ = ((d && d.url) || '').replace(/\/+$/, ''); })
    .catch(() => {});
  window.fetch = async function(input, init) {
    await ready;
    if (typeof input === 'string' && /^\/(api|kw|proxy)(\/|\?|$)/.test(input) && window.__NH_API_BASE__) {
      input = window.__NH_API_BASE__ + input;
    }
    return origFetch(input, init);
  };
})();
</script>
<style>
  :root {
    --bg: #0C0D10; --surface: #14161B; --surface-2: #1C2029;
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.14);
    --text: #ECEEF2; --text-2: #B6BCC8; --muted: #7C8392;
    --accent: #E5B869; --accent-ink: #151109; --accent-soft: rgba(229,184,105,0.14);
    --green: #3CCB7F; --red: #E55368;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-bottom: 48px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: rgba(12,13,16,0.9); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand-dot { color: var(--accent); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat-val { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; font-size: 13.5px;
    background: var(--bg); border: 1px solid var(--line-strong); color: var(--text); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    padding: 5px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 500;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); cursor: pointer;
  }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn {
    padding: 9px 15px; border-radius: 9px; font-size: 13.5px; font-weight: 600;
    border: 1px solid transparent; cursor: pointer; background: var(--surface-2); color: var(--text);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--text-2); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .new-codes {
    margin-top: 12px; padding: 12px; border-radius: 10px;
    background: rgba(229,184,105,0.08); border: 1px solid rgba(229,184,105,0.3);
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13.5px; line-height: 1.8;
  }
  .code-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .code-item:last-child { border-bottom: none; }
  .code-str { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13.5px; font-weight: 600; }
  .code-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 600; }
  .tag.ok { background: rgba(60,203,127,0.14); color: var(--green); }
  .tag.used { background: var(--surface-2); color: var(--muted); }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 99;
    background: rgba(20,22,27,0.95); border: 1px solid var(--accent); color: var(--text);
    padding: 8px 16px; border-radius: 99px; font-size: 13px;
  }
  .switch-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .switch-row input { width: auto; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Nova<span class="brand-dot">.</span>Hub 站长后台</div>
  <div style="display:flex;gap:8px">
    <a href="/" class="btn ghost sm" style="text-decoration:none">返回前台</a>
    <button id="btnLogout" class="btn ghost sm hidden">退出</button>
  </div>
</header>

<div id="toast" class="toast hidden"></div>

<main class="wrap">
  <!-- 登录视图 -->
  <section id="loginView" class="card" style="max-width:400px;margin:48px auto">
    <h2>管理员登录</h2>
    <label>站长后台密码</label>
    <input id="admPwd" type="password" placeholder="输入管理员密码（初始：NovaAdmin888）" autocomplete="current-password">
    <button id="btnLogin" class="btn primary" style="width:100%;margin-top:14px">进入后台</button>
  </section>

  <!-- 控制台视图 -->
  <section id="dashView" class="hidden">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="sUsers">0</div><div class="stat-lbl">总注册用户</div></div>
      <div class="stat"><div class="stat-val" id="sPro">0</div><div class="stat-lbl">有效 Pro 会员</div></div>
      <div class="stat"><div class="stat-val" id="sUnused">0</div><div class="stat-lbl">待核销卡密</div></div>
      <div class="stat"><div class="stat-val" id="sUsed">0</div><div class="stat-lbl">已核销卡密</div></div>
    </div>

    <!-- 批量发卡 -->
    <div class="card">
      <h2>批量生成 Pro 卡密</h2>
      <div class="chips" id="presetDays">
        <button class="chip active" data-d="30">月卡 (30天)</button>
        <button class="chip" data-d="90">季卡 (90天)</button>
        <button class="chip" data-d="365">年卡 (365天)</button>
        <button class="chip" data-d="36500">永久卡</button>
      </div>
      <div class="row">
        <div><label>生成数量</label><input id="genCount" type="number" min="1" max="100" value="5"></div>
        <div><label>有效天数</label><input id="genDays" type="number" min="1" max="36500" value="30"></div>
        <div><label>批次备注</label><input id="genNote" placeholder="如：赞助月卡"></div>
      </div>
      <button id="btnGen" class="btn primary" style="width:100%;margin-top:12px">立即生成卡密</button>
      <div id="newCodesWrap" class="new-codes hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;color:var(--accent)">本次新生成卡密：</span>
          <button id="btnCopyAll" class="btn primary sm">一键全部复制</button>
        </div>
        <div id="newCodesList"></div>
      </div>
    </div>

    <!-- 卡密台账 -->
    <div class="card">
      <h2>
        <span>卡密台账</span>
        <div class="chips" style="margin:0" id="filterChips">
          <button class="chip active" data-f="all">全部</button>
          <button class="chip" data-f="unused">未使用</button>
          <button class="chip" data-f="used">已核销</button>
        </div>
      </h2>
      <div id="codeLedger"></div>
    </div>

    <!-- 赞助广告位配置 -->
    <div class="card">
      <h2>赞助广告位动态配置</h2>
      <label class="switch-row"><input id="adEnabled" type="checkbox"> <span>开启前台赞助卡片（Pro 会员自动免广告）</span></label>
      <label>赞助标题</label><input id="adTitle">
      <label>赞助描述</label><input id="adDesc">
      <div class="row">
        <div><label>按钮文字</label><input id="adBtn"></div>
        <div><label>跳转链接（留空则跳会员中心）</label><input id="adUrl" placeholder="https://..."></div>
      </div>
      <label>会员中心赞助说明</label><textarea id="sponsorTip" rows="2"></textarea>
      <button id="btnSaveAd" class="btn primary" style="width:100%;margin-top:12px">保存并立即生效</button>
    </div>

    <!-- 修改管理员密码 -->
    <div class="card">
      <h2>修改站长后台密码</h2>
      <div class="row">
        <div><label>原密码</label><input id="oldPwd" type="password"></div>
        <div><label>新密码（至少 6 位）</label><input id="newPwd" type="password"></div>
      </div>
      <button id="btnChgPwd" class="btn ghost" style="width:100%;margin-top:12px">更新管理员密码</button>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem("nh_admin_token") || "";
let allCodes = [];
let curFilter = "all";
let lastGenerated = [];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 2000);
}

async function api(path, method = "GET", body = null) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/admin/login") {
    logout();
    throw new Error("登录已过期，请重新登录");
  }
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

function logout() {
  token = ""; localStorage.removeItem("nh_admin_token");
  $("#dashView").classList.add("hidden");
  $("#btnLogout").classList.add("hidden");
  $("#loginView").classList.remove("hidden");
}

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast("已复制到剪贴板"); }
  catch { prompt("请手动复制：", txt); }
}

function renderLedger() {
  const list = allCodes.filter((c) => curFilter === "all" ? true : curFilter === "used" ? c.used : !c.used);
  const el = $("#codeLedger");
  if (!list.length) { el.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:16px 0;text-align:center">暂无记录</div>`; return; }
  el.innerHTML = list.map((c) => {
    const dt = c.used_at ? new Date(c.used_at * 1000).toLocaleString() : "";
    const meta = [c.days + " 天", c.note, c.used ? `核销人: ${c.used_by} (${dt})` : "待发放"].filter(Boolean).join(" · ");
    return `<div class="code-item">
      <div style="min-width:0;flex:1">
        <div class="code-str">${c.code}</div>
        <div class="code-meta">${meta}</div>
      </div>
      <span class="tag ${c.used ? "used" : "ok"}">${c.used ? "已用" : "可用"}</span>
      ${c.used ? "" : `<button class="btn ghost sm" data-cp="${c.code}">复制</button>`}
    </div>`;
  }).join("");
  el.querySelectorAll("[data-cp]").forEach((b) => b.onclick = () => copyText(b.dataset.cp));
}

async function loadDash() {
  try {
    const d = await api("/api/admin/dashboard");
    $("#loginView").classList.add("hidden");
    $("#dashView").classList.remove("hidden");
    $("#btnLogout").classList.remove("hidden");
    $("#sUsers").textContent = d.stats.total_users;
    $("#sPro").textContent = d.stats.pro_users;
    $("#sUnused").textContent = d.stats.unused_codes;
    $("#sUsed").textContent = d.stats.used_codes;
    allCodes = d.codes || [];
    renderLedger();
    $("#adEnabled").checked = !!d.config.ad_enabled;
    $("#adTitle").value = d.config.ad_title || "";
    $("#adDesc").value = d.config.ad_desc || "";
    $("#adBtn").value = d.config.ad_btn || "";
    $("#adUrl").value = d.config.ad_url || "";
    $("#sponsorTip").value = d.config.sponsor_tip || "";
  } catch (e) {
    toast(e.message);
  }
}

$("#btnLogin").onclick = async () => {
  const password = $("#admPwd").value.trim();
  if (!password) return toast("请输入密码");
  try {
    const d = await api("/api/admin/login", "POST", { password });
    token = d.token;
    localStorage.setItem("nh_admin_token", token);
    $("#admPwd").value = "";
    loadDash();
  } catch (e) { toast(e.message); }
};
$("#admPwd").onkeydown = (e) => { if (e.key === "Enter") $("#btnLogin").click(); };
$("#btnLogout").onclick = logout;

$("#presetDays").querySelectorAll(".chip").forEach((c) => {
  c.onclick = () => {
    $("#presetDays").querySelectorAll(".chip").forEach((x) => x.classList.remove("active"));
    c.classList.add("active");
    $("#genDays").value = c.dataset.d;
  };
});

$("#filterChips").querySelectorAll(".chip").forEach((c) => {
  c.onclick = () => {
    $("#filterChips").querySelectorAll(".chip").forEach((x) => x.classList.remove("active"));
    c.classList.add("active");
    curFilter = c.dataset.f;
    renderLedger();
  };
});

$("#btnGen").onclick = async () => {
  try {
    const d = await api("/api/admin/codes", "POST", {
      count: Number($("#genCount").value) || 1,
      days: Number($("#genDays").value) || 30,
      note: $("#genNote").value.trim(),
    });
    lastGenerated = d.codes || [];
    $("#newCodesList").innerHTML = lastGenerated.map((x) => `<div>${x}</div>`).join("");
    $("#newCodesWrap").classList.remove("hidden");
    toast(`已成功生成 ${lastGenerated.length} 张卡密`);
    loadDash();
  } catch (e) { toast(e.message); }
};
$("#btnCopyAll").onclick = () => copyText(lastGenerated.join("\n"));

$("#btnSaveAd").onclick = async () => {
  try {
    await api("/api/admin/config", "POST", {
      ad_enabled: $("#adEnabled").checked,
      ad_title: $("#adTitle").value.trim(),
      ad_desc: $("#adDesc").value.trim(),
      ad_btn: $("#adBtn").value.trim(),
      ad_url: $("#adUrl").value.trim(),
      sponsor_tip: $("#sponsorTip").value.trim(),
    });
    toast("赞助广告位配置已生效");
  } catch (e) { toast(e.message); }
};

$("#btnChgPwd").onclick = async () => {
  const old_password = $("#oldPwd").value.trim();
  const new_password = $("#newPwd").value.trim();
  if (!old_password || !new_password) return toast("请填写原密码与新密码");
  try {
    await api("/api/admin/password", "POST", { old_password, new_password });
    $("#oldPwd").value = $("#newPwd").value = "";
    toast("管理员密码已修改，请牢记新密码");
  } catch (e) { toast(e.message); }
};

if (token) loadDash();
</script>
</body>
</html>
